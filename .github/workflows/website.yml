name: Website
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: website-production
  cancel-in-progress: false
jobs:
  website:
    if: github.repository == 'Westmorland/westmorland.me' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- dist
      - name: Unit, HTTP, browser and payload checks
        env:
          CHROME: /usr/bin/google-chrome
          SECURITY_HEADERS: '1'
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox
          npm test
          npm run test:integration
          npm run test:e2e
          npm run check:payload
      - name: Require production event and deployment secret
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: bash scripts/deploy-guard.sh
      - name: Upload tested website only
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
